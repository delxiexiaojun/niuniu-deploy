<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牛牛 · 纯前端 P2P 好友房</title>
  <link rel="stylesheet" href="css/style.css?v=20261025o?v=20261025o">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>牛牛 <span>P2P 好友房</span></h1>
        <p class="sub">房主浏览器负责洗牌与结算 · 4 人 · 无真钱下注</p>
      </div>
      <div id="netBadge" class="net-badge"></div>
    </header>

    <section id="lobby" class="panel">
      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" maxlength="12" placeholder="最多 12 个字符" autocomplete="off">
      </div>

      <div class="row">
        <select id="selPlayers" class="rounds-select" title="人数">
          <option value="2">2 人</option>
          <option value="3">3 人</option>
          <option value="4" selected>4 人</option>
          <option value="5">5 人</option>
          <option value="6">6 人</option>
          <option value="7">7 人</option>
          <option value="8">8 人</option>
        </select>
        <select id="selRounds" class="rounds-select" title="对局数">
          <option value="8">8 局</option>
          <option value="12" selected>12 局</option>
          <option value="16">16 局</option>
          <option value="20">20 局</option>
        </select>
        <button id="btnCreate" class="btn primary">创建房间</button>
      </div>

      <div class="divider"><span>或加入已有房间</span></div>

      <div class="row">
        <input id="roomCode" inputmode="numeric" maxlength="6" placeholder="6 位房间号">
        <button id="btnJoin" class="btn">加入房间</button>
      </div>

      <button id="btnResume" class="btn ghost wide" hidden>重连上次房间</button>
      <p id="lobbyMsg" class="msg"></p>

      <ul class="tips">
        <li>房主是本局唯一权威：洗牌、发牌、牛牛判定、比牌结算都在房主浏览器完成。</li>
        <li>每个玩家只会收到自己的 5 张牌，全部亮牌后才公开牌面。</li>
        <li>刷新页面可用本地 token 回到原座位；房主刷新或关闭页面则房间结束。</li>
      </ul>
    </section>

    <!-- 分享链接进入：独立界面，只填昵称，不预填 -->
    <section id="shareJoin" class="panel" hidden>
      <div class="field">
        <label>朋友邀请你加入房间</label>
        <div class="share-room-code"><strong id="shareRoomCode">------</strong></div>
      </div>
      <div class="field">
        <label for="shareNick">你的昵称</label>
        <input id="shareNick" maxlength="12" placeholder="输入昵称后进入房间" autocomplete="off">
      </div>
      <button id="btnShareJoin" class="btn primary wide">进入房间</button>
    </section>

    <section id="room" hidden>
      <div class="panel room-bar">
        <div class="room-code">房间号 <strong id="roomId" class="copyable" title="点击复制房间号">------</strong></div>
        <div id="phaseInfo" class="phase-info"></div>
        <span id="countdown" class="countdown" hidden></span>
        <div class="room-actions">
          <button id="btnHistory" class="btn small">战绩记录</button>
          <button id="btnDownload" class="btn small gold" hidden>下载战绩图片</button>
          <button id="btnReconnect" class="btn small" hidden>重新连接</button>
          <button id="btnSound" class="btn small ghost" title="音效/语音开关">🔊</button>
          <button id="btnShare" class="btn small">分享链接</button>
          <button id="btnLeave" class="btn small ghost">离开房间</button>
        </div>
      </div>

      <div id="statusLine" class="status-line"></div>

      <div class="table-wrap">
        <div class="table-felt"></div>
        <div id="tableCards" class="table-cards"></div>
        <ul id="seatList" class="seat-grid"></ul>
        <button id="btnReady" class="btn primary table-ready-btn" hidden>准备</button>
        <span id="robWrap" class="table-rob-wrap" hidden>
          <button class="btn gold rob-btn" data-want="1">抢庄</button>
          <button class="btn rob-btn" data-want="0">不抢</button>
        </span>
        <span id="robInfo" class="table-center-info" hidden></span>
        <span id="revealWrap" class="table-reveal-wrap" hidden>
          <button class="btn gold mult-btn" data-mult="5">下注 ×5</button>
          <button class="btn gold mult-btn" data-mult="8">下注 ×8</button>
          <button class="btn gold mult-btn" data-mult="12">下注 ×12</button>
        </span>
        <span id="betInfo" class="table-center-info" hidden></span>
        <span id="showWrap" class="table-rob-wrap" hidden>
          <button id="btnShow" class="btn gold rob-btn">亮牌</button>
        </span>
        <span id="revealedInfo" class="table-center-info" hidden></span>
      </div>

      <div id="historyPanel" class="panel" hidden>
        <div class="panel-head">
          <h2>战绩记录</h2>
          <span id="historyLabel" class="hand-label"></span>
        </div>
        <div id="historyBody" class="history-body"></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/peerjs.min.js"></script>
  <script src="js/evaluator.js?v=20261025o"></script>
  <script src="js/game.js?v=20261025o"></script>
  <script src="js/peer.js?v=20261025o"></script>
  <script src="js/sound.js?v=20261025o"></script>
  <script src="js/app.js?v=20261025o"></script>
</body>
</html>
